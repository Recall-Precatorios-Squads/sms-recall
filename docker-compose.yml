# sms-recall no mini PC: docker compose up -d --build
# traefik (porta da tela, distribui entre as réplicas) → app ×2 (telas + API) → postgres (a fila)
# worker (envia pelos celulares) · migrate (aplica as migrações e sai) · backup (diário) · tunel (opcional: --profile tunel)
name: sms-recall

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`sms-recall`)
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - "${PORTA:-3000}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORTA_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://sms:${POSTGRES_PASSWORD}@postgres:5432/sms
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    command: ["node", "dist/servidor.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sms:${POSTGRES_PASSWORD}@postgres:5432/sms
      HOST: 0.0.0.0
      PORT: 3000
    deploy:
      replicas: ${APP_REPLICAS:-2}
    labels:
      - traefik.enable=true
      - traefik.http.routers.sms.rule=PathPrefix(`/`)
      - traefik.http.routers.sms.entrypoints=web
      - traefik.http.services.sms.loadbalancer.server.port=3000
      - traefik.http.services.sms.loadbalancer.healthcheck.path=/health
      - traefik.http.services.sms.loadbalancer.healthcheck.interval=10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: ["node", "dist/worker/index.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sms:${POSTGRES_PASSWORD}@postgres:5432/sms
      PASTA_BACKUPS: /backups
    volumes:
      - ./backups:/backups:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MANTER_DIAS: ${BACKUP_MANTER_DIAS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Opcional: deixa o CRM (na AWS) chegar à API /v1 sem abrir porta no escritório.
  # docker compose --profile tunel up -d   (precisa de TUNNEL_TOKEN no .env; no painel da Cloudflare,
  # aponte o hostname público para http://traefik:80 e libere SÓ o caminho /v1/*)
  tunel:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["tunel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - traefik

volumes:
  pgdata:
